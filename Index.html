<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download Launcher App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background-color: #1e293b;
      padding: 30px;
      border-radius: 16px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      text-align: center;
    }
    .badge {
      background-color: #22c55e;
      color: #000;
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 14px;
      display: inline-block;
    }
    h1 { margin: 15px 0 5px; font-size: 24px; }
    p { color: #94a3b8; font-size: 14px; line-height: 1.5; }
    .changelog {
      background-color: #0f172a;
      padding: 15px;
      border-radius: 8px;
      text-align: left;
      margin: 20px 0;
      font-size: 13px;
      white-space: pre-wrap;
      max-height: 180px;
      overflow-y: auto;
    }
    .btn-download {
      display: block;
      background-color: #3b82f6;
      color: white;
      text-decoration: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      transition: background-color 0.3s;
    }
    .btn-download:hover {
      background-color: #2563eb;
    }
    .btn-download.disabled {
      background-color: #64748b;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <span class="badge" id="version-badge">Memuat versi...</span>
    <h1>Launcher App</h1>
    <p>Aplikasi launcher Android ringan dan cepat.</p>

    <div class="changelog" id="changelog-box">
      <em>Sedang mengambil catatan rilis terbaru dari GitHub...</em>
    </div>

    <!-- Tombol Download yang diisi otomatis oleh JavaScript -->
    <a href="#" id="download-btn" class="btn-download disabled">
      ⏳ Memuat Link Unduhan...
    </a>
  </div>

  <script>
    // Repository GitHub kamu
    const GITHUB_REPO = "ceriirawan0-blip/Launcher";

    // Format ukuran file (Bytes ke KB/MB)
    function formatFileSize(bytes) {
      if (bytes < 1024 * 1024) {
        return (bytes / 1024).toFixed(0) + " KB";
      }
      return (bytes / (1024 * 1024)).toFixed(1) + " MB";
    }

    async function fetchLatestRelease() {
      const downloadBtn = document.getElementById("download-btn");
      const versionBadge = document.getElementById("version-badge");
      const changelogBox = document.getElementById("changelog-box");

      try {
        // Request data rilis paling baru via GitHub REST API
        const response = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/releases/latest`);
        
        if (!response.ok) {
          throw new Error("Gagal mengambil data dari GitHub API");
        }

        const data = await response.json();

        // 1. Tampilkan Tag Versi (Contoh: v1.3)
        const version = data.tag_name;
        versionBadge.textContent = `${version} Terbaru`;

        // 2. Tampilkan Changelog (Deskripsi Rilis)
        if (data.body) {
          changelogBox.innerHTML = `<strong>Catatan Rilis ${version}:</strong>\n${data.body}`;
        } else {
          changelogBox.textContent = "Tidak ada catatan rilis.";
        }

        // 3. Cari file berformat .apk dalam daftar assets
        const apkAsset = data.assets.find(asset => asset.name.endsWith('.apk'));

        if (apkAsset) {
          const fileSize = formatFileSize(apkAsset.size);
          
          // Pasang link unduhan langsung ke tombol
          downloadBtn.href = apkAsset.browser_download_url;
          downloadBtn.innerHTML = `📥 Download ${apkAsset.name} (${fileSize})`;
          downloadBtn.classList.remove("disabled");
        } else {
          // Fallback jika tidak ada file APK di assets
          downloadBtn.href = data.html_url;
          downloadBtn.innerHTML = `🌐 Halaman Rilis ${version}`;
          downloadBtn.classList.remove("disabled");
        }

      } catch (error) {
        console.error("Error:", error);
        
        // Handling jika API limit tercapai atau internet terganggu
        versionBadge.textContent = "Rilis Terbaru";
        changelogBox.textContent = "Gagal memuat catatan rilis otomatis.";
        downloadBtn.href = `https://github.com/${GITHUB_REPO}/releases/latest`;
        downloadBtn.innerHTML = "📥 Download via GitHub Releases";
        downloadBtn.classList.remove("disabled");
      }
    }

    // Jalankan fungsi saat halaman dimuat
    fetchLatestRelease();
  </script>

</body>
</html>
